name: Mac app

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The script's own suite, and the app's core driving the real script on
  # Linux (macos/sim.c): quick, and it fails before the Mac build is spent.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - name: Script suite
        run: lua5.4 tests/run.lua
      - name: App core against the script
        run: |
          git clone --quiet --depth 1 --branch v5.4.7 https://github.com/lua/lua.git /tmp/lua
          gcc -O1 -w -DLUA_USE_POSIX -DMAKE_LIB -c /tmp/lua/onelua.c -o /tmp/lua.o
          gcc -O1 -Wall -std=c99 -D_POSIX_C_SOURCE=200809L -I/tmp/lua -o /tmp/sim \
            macos/sim.c macos/host.c /tmp/lua.o -lm
          out=$(/tmp/sim "$PWD/Orchestration Helper.lua" 8 trombone "" @close "")
          echo "$out" | tail -3
          echo "$out" | grep -q '^Trombone$'
          echo "$out" | grep -q 'title "Orchestration Helper — Trombone"'
          echo "$out" | grep -q 'setting OrchestrationHelper/w = 760'

  app:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" macos/build.sh
      - name: Check it is universal and opens
        run: |
          lipo -archs "build/Orchestration Helper.app/Contents/MacOS/Orchestration Helper"
          open "build/Orchestration Helper.app"
          sleep 6
          pgrep -x "Orchestration Helper"
          shot() {   # the window, as a small JPEG printed into the log
            screencapture -x -R150,110,760,708 "build/$1.png" || return 0
            sips -s format jpeg -s formatOptions 55 "build/$1.png" --out "build/$1.jpg" >/dev/null
            echo "SHOT-BEGIN $1"; base64 -i "build/$1.jpg" | fold -w 2000; echo "SHOT-END $1"
          }
          shot index
          # type a search, as a user would (needs the runner's accessibility access)
          osascript -e 'tell application "System Events" to keystroke "trombone"' || true
          sleep 2
          shot trombone
          osascript -e 'quit app "Orchestration Helper"'
          sleep 2
          ! pgrep -x "Orchestration Helper"
          defaults read com.kallums.orchestration-helper || true
      - name: Zip
        run: ditto -c -k --keepParent "build/Orchestration Helper.app" build/Orchestration-Helper-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Orchestration-Helper-macOS
          path: build/Orchestration-Helper-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/*.png
          if-no-files-found: ignore
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Orchestration-Helper-macOS.zip
